<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  .card{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(1300px 780px at 72% 30%, #123449 0%, #0b2230 58%, #081a25 100%);
    color:#f8f3e9;font-family:Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;padding:78px 84px 66px}
  svg.disc{position:absolute;right:-130px;bottom:-150px;width:480px;height:480px}
  .eyebrow{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:21px;
    font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#a9d4e7}
  h1{font-size:150px;line-height:1;letter-spacing:.09em;text-transform:uppercase;color:#f8f3e9;margin-top:30px}
  .rule{width:110px;height:4px;background:#c19a3f;margin:34px 0 26px;border-radius:2px}
  .sub{font-size:42px;line-height:1.3;color:#dbe7ef;max-width:900px}
  .sub i{font-style:italic;color:#f8f3e9}
  .facts{margin-top:auto;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:24px;letter-spacing:.04em;color:#c19a3f;display:flex;gap:14px;flex-wrap:wrap}
  .facts span.sep{opacity:.55;color:#a9d4e7}
</style>
</head>
<body>
<div class="card">
  <svg class="disc" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#2e7ba3" stroke-width="3" opacity=".6"/>
    <circle cx="100" cy="100" r="62" fill="none" stroke="#2e7ba3" stroke-width="3" opacity=".45"/>
    <circle cx="100" cy="100" r="34" fill="none" stroke="#c19a3f" stroke-width="3" opacity=".5"/>
    <circle cx="100" cy="100" r="10" fill="#c19a3f" opacity=".65"/>
  </svg>
  <p class="eyebrow">Roman-inspired Mediterranean &middot; On Oneida Lake</p>
  <h1>AZURA</h1>
  <div class="rule"></div>
  <p class="sub">Handmade pasta, Roman-style pizza and fresh seafood &mdash; <i>the kitchen of Chef Luca Cardente, opened November 2026</i></p>
  <div class="facts">
    <span>Open daily from noon</span><span class="sep">&middot;</span>
    <span>Cicero, NY 13039</span><span class="sep">&middot;</span>
    <span>(315) 715-6895</span>
  </div>
</div>
</body>
</html>
